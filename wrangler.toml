name = "luxury-store"
main = "src/worker.js"
compatibility_date = "2026-11-24"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "luxury_store_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Optional product image storage. Create an R2 bucket named luxury-store-media.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "luxury-store-media"
